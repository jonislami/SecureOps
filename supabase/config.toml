# Supabase CLI project config. `project_id` links to a remote project via
# `supabase link`. Values here configure the LOCAL dev stack.

project_id = "sentinel"

[db]
port = 54322
major_version = 15

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "sentinel://"]
jwt_expiry = 3600
enable_signup = false        # users are provisioned by admins, not self-signup

[auth.email]
enable_confirmations = false

[realtime]
enabled = true

[storage]
enabled = true
